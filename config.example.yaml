# Copy to config.yaml (or pass --config / set BOOK_ARCHIVAR_CONFIG).
# Every key is optional; these are the defaults.

# Holds library/ (book.md, chapters.json, metadata.json per book) and chroma/.
data_dir: ~/.local/share/book-archivar

# Any OpenAI-compatible /v1/embeddings endpoint. Defaults target Ollama:
#   ollama pull bge-m3
embedding_base_url: http://localhost:11434/v1
embedding_model: bge-m3
embedding_api_key: not-needed

chunk_size: 1500      # characters
chunk_overlap: 200

# Add-ons are off unless enabled here.
addons:
  inbox:                     # import EPUBs dropped into a folder (`serve` / `watch`)
    enabled: false
    path: ~/book-inbox
    interval: 60             # poll seconds
  duplicates:                # park "same book, other file" in review/ instead of importing it
    enabled: false           # resolve with: book-archivar review list|keep-both|replace|discard
    # review_dir: ~/.local/share/book-archivar/review
  logging:                   # JSON-lines log file (rotating) next to the stderr log
    enabled: false
    # dir: ~/.local/share/book-archivar/logs
    level: INFO
  pdf:                       # import text PDFs: pip install "book-archivar[pdf]"
    enabled: false
  calibre:                   # MOBI/AZW3/DOCX/... through Calibre's ebook-convert
    enabled: false
    # binary: ebook-convert
    # suffixes: [.mobi, .azw3, .fb2, .docx, .odt, .rtf]
